apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  {{- include "aws-cd-georgia-demo-app.labels" . | nindent 2 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}
  {{- include "aws-cd-georgia-demo-app.selectorLabels" . | nindent 2 }}
  ports:
  - name: {{ .Values.service.ports.name }}
    port: {{ .Values.service.ports.port }}
    targetPort: {{ .Values.service.ports.targetPort }}


