deployment:
  replicas: 1
  image:
    repository: ghcr.io/igorgolm/aws-cd-georgia-demo-app ## !! Update this to your image repository ##
    tag: c46a24c69d386f04e537f51afaec04e195a8e443 ## !! Update this to your image tag ##
  imagePullPolicy: IfNotPresent
  serviceAccount: default
  resources:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 50m
      memory: 100Mi
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

service:
  type: ClusterIP
  ports:
    name: http
    port: 80
    targetPort: 8080


